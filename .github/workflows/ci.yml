name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile guest_gateway.py rich_renderer.py
      - name: Test
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest -q
      - name: Check shell scripts
        run: bash -n init-env.sh setup-hermes-profile.sh run-docker.sh install-launchagent.sh run.sh
